openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Road Trip Planner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trip
    description: Road trip planning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trip/vehicle-check:
    post:
      operationId: checkVehicle
      tags: [trip]
      summary: Check vehicle suitability
      description: Check if the selected vehicle is suitable for the trip and suggest alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCheckRequest"
      responses:
        "200":
          description: Vehicle suitability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleCheckResponse"

  /trip/plan:
    post:
      operationId: planTrip
      tags: [trip]
      summary: Plan a road trip
      description: Generate route options, stops, and recommendations for a road trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripPlanRequest"
      responses:
        "200":
          description: Trip plan with routes, stops, and meal recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPlanResponse"

  /trip/adjust:
    post:
      operationId: adjustTrip
      tags: [trip]
      summary: Adjust trip plan due to delay
      description: Dynamically adjust the trip plan when there is a delay, replacing closed places with open alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripAdjustRequest"
      responses:
        "200":
          description: Updated trip plan with adjusted stops and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPlanResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VehicleCheckRequest:
      type: object
      properties:
        travelers:
          type: integer
          description: Number of travelers
          minimum: 1
        vehicleType:
          type: string
          description: Type of vehicle (e.g., sedan, suv, minivan, sports_car, pickup_truck, motorcycle, rv)
        destination:
          type: string
          description: Trip destination for context
      required:
        - travelers
        - vehicleType

    VehicleCheckResponse:
      type: object
      properties:
        suitable:
          type: boolean
          description: Whether the vehicle is suitable for the trip
        suitabilityScore:
          type: integer
          description: Score from 0-100 indicating suitability
        issues:
          type: array
          items:
            type: string
          description: List of issues with the current vehicle
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/VehicleRecommendation"
          description: Better vehicle alternatives
        message:
          type: string
          description: Summary message about vehicle suitability
      required:
        - suitable
        - suitabilityScore
        - issues
        - recommendations
        - message

    VehicleRecommendation:
      type: object
      properties:
        vehicleType:
          type: string
        reason:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            type: string
      required:
        - vehicleType
        - reason
        - capacity
        - features

    TripPlanRequest:
      type: object
      properties:
        travelers:
          type: integer
          minimum: 1
        vehicleType:
          type: string
        startLocation:
          type: string
        destination:
          type: string
        startTime:
          type: string
          description: ISO 8601 datetime string
        preferences:
          type: array
          items:
            type: string
          description: Travel preferences (e.g., scenic, fast, food, nature, history)
      required:
        - travelers
        - vehicleType
        - startLocation
        - destination
        - startTime

    TripPlanResponse:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        selectedRoute:
          $ref: "#/components/schemas/Route"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
        mealRecommendations:
          type: array
          items:
            $ref: "#/components/schemas/MealStop"
        estimatedArrival:
          type: string
          description: ISO 8601 datetime of estimated arrival
        totalDistance:
          type: string
          description: Total distance (e.g., "320 miles")
        summary:
          type: string
          description: Human-readable summary of the trip plan
      required:
        - routes
        - stops
        - mealRecommendations
        - estimatedArrival
        - totalDistance
        - summary

    Route:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Route name (e.g., "Fastest Route", "Scenic Route")
        type:
          type: string
          enum: [fastest, scenic, balanced]
        duration:
          type: string
          description: Estimated drive time (e.g., "4h 30m")
        distance:
          type: string
        highlights:
          type: array
          items:
            type: string
          description: Notable features of this route
        description:
          type: string
      required:
        - id
        - name
        - type
        - duration
        - distance
        - highlights
        - description

    Stop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [attraction, viewpoint, rest_area, gas_station, town, landmark]
        description:
          type: string
        estimatedArrivalTime:
          type: string
          description: ISO 8601 datetime
        estimatedStopDuration:
          type: string
          description: e.g., "30 min", "1 hour"
        distanceFromStart:
          type: string
        mustVisit:
          type: boolean
        openHours:
          type: string
          description: Operating hours if applicable
        isOpen:
          type: boolean
          description: Whether the place is open at estimated arrival time
        coordinates:
          $ref: "#/components/schemas/Coordinates"
      required:
        - id
        - name
        - type
        - description
        - estimatedArrivalTime
        - estimatedStopDuration
        - distanceFromStart
        - mustVisit
        - isOpen

    MealStop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        cuisine:
          type: string
        description:
          type: string
        estimatedArrivalTime:
          type: string
        location:
          type: string
        priceRange:
          type: string
          enum: [$, $$, $$$]
        openHours:
          type: string
        isOpen:
          type: boolean
        mustTry:
          type: array
          items:
            type: string
          description: Recommended dishes
        alternativeOptions:
          type: array
          items:
            $ref: "#/components/schemas/MealAlternative"
      required:
        - id
        - name
        - mealType
        - cuisine
        - description
        - estimatedArrivalTime
        - location
        - priceRange
        - isOpen
        - mustTry

    MealAlternative:
      type: object
      properties:
        name:
          type: string
        cuisine:
          type: string
        priceRange:
          type: string
        openHours:
          type: string
        reason:
          type: string
          description: Why this is a good alternative
      required:
        - name
        - cuisine
        - priceRange
        - reason

    TripAdjustRequest:
      type: object
      properties:
        originalRequest:
          $ref: "#/components/schemas/TripPlanRequest"
        delayMinutes:
          type: integer
          description: Number of minutes the trip is delayed
        currentLocation:
          type: string
          description: Current location of the travelers
        reason:
          type: string
          description: Reason for the delay (optional)
      required:
        - originalRequest
        - delayMinutes

    Coordinates:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
